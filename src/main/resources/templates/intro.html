<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Colony | Briefing</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="flat-bg">
    <main class="layout intro-layout">
        <header class="panel mission-header">
            <div class="header-copy">
                <p class="eyebrow">Code Colony</p>
                <h1 th:text="${missionTitle}">Mission Briefing</h1>
                <p class="lead" th:text="${missionSummary}">Helix Dynamics has assigned you to oversee the recovery of a remote colony site from orbit around Eryndor-IV.</p>
            </div>
            <div class="header-objective">
                <p class="objective-label">Primary objective</p>
                <p class="objective-text" th:text="${missionObjective}">Investigate the colony site and restore critical systems in stages.</p>
            </div>
        </header>

        <section class="panel intro-card intro-briefing">
            <p class="eyebrow">Helix Dynamics</p>
            <h2 th:text="${briefingTitle}">Operational Briefing</h2>
            <div class="intro-copy narrative-markdown" th:utext="${briefingHtml}">
                <p class="panel-copy">Briefing text</p>
            </div>
            <div class="intro-controls">
                <div class="intro-audio">
                    <audio controls preload="none">
                        <source th:src="@{/audio/briefings/intro.mp3}" type="audio/mpeg">
                    </audio>
                </div>
                <div class="actions intro-actions">
                    <form th:action="@{/game-sessions}" method="post">
                        <button class="primary-action" type="submit">Start</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
