<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="resultPanels (runResult)">
    <div id="mission-status" class="status-slot" hx-swap-oob="outerHTML">
    <section th:replace="~{fragments/mission-panels :: statusPanelBody(runResult=${runResult})}">
        </section>
    </div>
    <div id="mission-feedback" class="feedback-slot">
        <section th:replace="~{fragments/mission-panels :: feedbackPanelBody(runResult=${runResult})}">
        </section>
    </div>
</th:block>

<section th:fragment="statusPanelBody (runResult)" class="panel status-panel"
         th:classappend="${runResult.success} ? ' success' : ''">
        <div class="section-header">
            <h2>CORE Status</h2>
            <span class="status-pill" th:text="${runResult.coreStatus.state}"
                  th:classappend="${#strings.equals(runResult.coreStatus.state, 'Online')} ? ' online' : ' offline'">Offline</span>
        </div>
        <dl class="status-list">
            <div class="status-row">
                <dt>Unit</dt>
                <dd th:text="${runResult.coreStatus.unitName}">CORE-01</dd>
            </div>
            <div class="status-row status-meter-row" th:if="${runResult.coreStatus.batteryLevel != null}">
                <dt>Power</dt>
                <dd class="status-meter meter-battery" aria-label="Power level">
                    <span class="status-meter-box"
                          th:each="box : ${#numbers.sequence(1, runResult.coreStatus.batteryCapacity)}"
                          th:classappend="${box <= runResult.coreStatus.batteryLevel} ? ' filled' : ' empty'"></span>
                    <span class="status-meter-value"
                          th:text="${runResult.coreStatus.batteryLevel + ' / ' + runResult.coreStatus.batteryCapacity}">0 / 5</span>
                </dd>
            </div>
            <div class="status-row status-meter-row" th:if="${runResult.coreStatus.healthLevel != null}">
                <dt>Health</dt>
                <dd class="status-meter meter-health" aria-label="Health level">
                    <span class="status-meter-box"
                          th:each="box : ${#numbers.sequence(1, runResult.coreStatus.healthCapacity)}"
                          th:classappend="${box <= runResult.coreStatus.healthLevel} ? ' filled' : ' empty'"></span>
                    <span class="status-meter-value"
                          th:text="${runResult.coreStatus.healthLevel + ' / ' + runResult.coreStatus.healthCapacity}">1 / 5</span>
                </dd>
            </div>
            <div class="status-row" th:if="${!#strings.isEmpty(runResult.coreStatus.dock)}">
                <dt>Dock</dt>
                <dd th:text="${runResult.coreStatus.dock}">Connected</dd>
            </div>
            <div class="status-row" th:if="${!#strings.isEmpty(runResult.coreStatus.position)}">
                <dt>Position</dt>
                <dd th:text="${runResult.coreStatus.position}">B1</dd>
            </div>
        </dl>
        <p class="status-note" th:text="${runResult.coreStatus.note}">Standby</p>
</section>

<section th:fragment="feedbackPanelBody (runResult)" class="panel feedback-panel">
        <h2 th:text="${runResult.headline}">Awaiting Run</h2>
        <p class="panel-summary" th:text="${runResult.summary}">Feedback summary</p>
        <ol class="event-list">
            <li th:each="event : ${runResult.simulationEvents}" th:text="${event}">Simulation event</li>
        </ol>
        <ul class="feedback-list">
            <li th:each="item : ${runResult.feedbackItems}" th:text="${item}">Feedback item</li>
        </ul>
</section>
</body>
</html>
