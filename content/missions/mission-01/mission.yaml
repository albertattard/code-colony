version: 1
missionId: mission-01
allowedCommands:
  - Core.connect()
execution:
  temporaryDirectoryPrefix: wake-the-core-
  resultFileName: wake-the-core-result.properties
  compilationFailureSummary: The code could not be compiled for Mission 01.
  executionStoppedSummary: Execution stopped before Mission 01 could be evaluated.
  initialStatusNoteTemplate: No telemetry available while offline.
objective:
  kind: connect_once
  successCondition: Establish a control link to CORE-01.
validation:
  runtimeExpectation: Mission 01 allows the CORE to be connected once.
  runtimeRetryHint: Fix the runtime problem and run the code again.
  messages:
    successHeadline: CORE Online
    successSummary: Control link established. CORE-01 is online, but telemetry shows a depleted battery and structural damage.
    successFeedback1: Mission objective completed.
    successFeedback2: Core.connect(); changed the visible state of the world.
    successFeedback3: The CORE still needs charging and repair before it can return to field work.
    incompleteHeadline: Mission Incomplete
    incompleteSummary: CORE-01 is still offline.
    incompleteFeedback1: Call Core.connect(); to bring the CORE online.
    incompleteFeedback2: Mission 01 only expects a single successful connection.
    statusNoteConnected: Telemetry online. Battery depleted. Structural damage detected.
    statusNoteDuplicateConnect: Connection established, then an invalid duplicate connect was attempted
    statusNoteOffline: No telemetry available while offline.
