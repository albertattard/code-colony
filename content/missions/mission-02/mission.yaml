version: 1
missionId: mission-02
allowedCommands:
  - Core.connect()
  - core.charge()
execution:
  temporaryDirectoryPrefix: charge-the-core-
  resultFileName: charge-the-core-result.properties
  compilationFailureSummary: The code could not be compiled for Mission 02.
  executionStoppedSummary: Execution stopped before Mission 02 could be evaluated.
  initialStatusNoteTemplate: CORE-01 remains online from Mission 01. Re-establish control for this run to operate the unit.
objective:
  kind: charge_to_full
  successCondition: Charge CORE-01 battery to full capacity.
validation:
  runtimeExpectation: Mission 02 expects one successful Core.connect() call to obtain a control reference and enough charge actions to reach full power.
  messages:
    successHeadline: CORE Charged
    successSummary: CORE-01 battery restored to full capacity. The unit now has enough power for basic movement.
    successFeedback1: Mission objective completed.
    successFeedback2: Core.connect() returned a Core instance you could reuse.
    successFeedback3: Each successful core.charge(); call restored one power segment.
    incompleteNoConnectionHeadline: Mission Incomplete
    incompleteNoConnectionSummary: CORE-01 is online, but your program did not obtain a control reference.
    incompleteNoConnectionFeedback1: Call Core.connect() and store the returned Core in a variable before charging it.
    incompleteNoConnectionFeedback2Template: Mission 02 is solved when the battery reaches {batteryCapacity} / {batteryCapacity}.
    incompleteChargingHeadline: Mission Incomplete
    incompleteChargingSummary: CORE-01 is online, but the battery is not full yet.
    incompleteChargingFeedback1: Store the connected CORE in a variable so you can call core.charge(); repeatedly.
    incompleteChargingFeedback2Template: Charge CORE-01 {remainingCharge} more time(s) to reach {batteryCapacity} / {batteryCapacity}.
    statusNoteDuplicateConnect: Control reference acquired, then an invalid duplicate connect was attempted.
    statusNoteFullyCharged: Battery restored. CORE-01 is ready for low-power field work.
    statusNoteCharging: Telemetry online. Battery charging in progress. Structural damage still detected.
    statusNoteNoControlReference: CORE-01 remains online from Mission 01. Use Core.connect() to obtain a control reference for this run.
